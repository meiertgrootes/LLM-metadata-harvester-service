services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-harvester}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a non-default PostgreSQL password}
      POSTGRES_DB: ${POSTGRES_DB:-harvester}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  migrate:
    image: llm-metadata-harvester-service-migrate:prod
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with URL-encoded PostgreSQL credentials}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - internal

  api:
    image: llm-metadata-harvester-service-api:prod
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with URL-encoded PostgreSQL credentials}
      WEBHOOK_ALLOWED_HOSTS: ""
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY:?Set WEBHOOK_SECRET_KEY to a Fernet key}
      WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-5}
      WEBHOOK_RETRY_BACKOFF: ${WEBHOOK_RETRY_BACKOFF:-2}
      WEBHOOK_RETRY_AFTER_MAX_SECONDS: ${WEBHOOK_RETRY_AFTER_MAX_SECONDS:-300}
      CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: ${CELERY_TASK_SOFT_TIME_LIMIT_SECONDS:-3300}
      CELERY_TASK_TIME_LIMIT_SECONDS: ${CELERY_TASK_TIME_LIMIT_SECONDS:-3600}
      JOB_PENDING_STALE_SECONDS: ${JOB_PENDING_STALE_SECONDS:-4500}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal

  worker:
    image: llm-metadata-harvester-service-worker:prod
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with URL-encoded PostgreSQL credentials}
      WEBHOOK_ALLOWED_HOSTS: ""
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY:?Set WEBHOOK_SECRET_KEY to a Fernet key}
      WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-5}
      WEBHOOK_RETRY_BACKOFF: ${WEBHOOK_RETRY_BACKOFF:-2}
      WEBHOOK_RETRY_AFTER_MAX_SECONDS: ${WEBHOOK_RETRY_AFTER_MAX_SECONDS:-300}
      CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: ${CELERY_TASK_SOFT_TIME_LIMIT_SECONDS:-3300}
      CELERY_TASK_TIME_LIMIT_SECONDS: ${CELERY_TASK_TIME_LIMIT_SECONDS:-3600}
      JOB_PENDING_STALE_SECONDS: ${JOB_PENDING_STALE_SECONDS:-4500}
      JOB_QUEUED_STALE_SECONDS: ${JOB_QUEUED_STALE_SECONDS:-86400}
      WEBHOOK_OUTBOX_LEASE_SECONDS: ${WEBHOOK_OUTBOX_LEASE_SECONDS:-60}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - internal
      # public network is required for outbound webhook delivery; no inbound ports are exposed
      - public

  beat:
    image: llm-metadata-harvester-service-worker:prod
    command: ["celery", "-A", "llm_metadata_harvester_service.core.celery_app.celery_app", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with URL-encoded PostgreSQL credentials}
      JOB_RECONCILE_INTERVAL_SECONDS: ${JOB_RECONCILE_INTERVAL_SECONDS:-60}
      JOB_PENDING_STALE_SECONDS: ${JOB_PENDING_STALE_SECONDS:-4500}
      JOB_QUEUED_STALE_SECONDS: ${JOB_QUEUED_STALE_SECONDS:-86400}
      WEBHOOK_OUTBOX_INTERVAL_SECONDS: ${WEBHOOK_OUTBOX_INTERVAL_SECONDS:-5}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.public.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
      - public

volumes:
  pgdata:

networks:
  internal:
    internal: true
  public:
