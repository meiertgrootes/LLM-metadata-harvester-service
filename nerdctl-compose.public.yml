services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-harvester}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harvester}
      POSTGRES_DB: ${POSTGRES_DB:-harvester}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-harvester} -d ${POSTGRES_DB:-harvester}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    image: llm-metadata-harvester-service-api:prod
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-harvester}:${POSTGRES_PASSWORD:-harvester}@postgres:5432/${POSTGRES_DB:-harvester}
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  worker:
    image: llm-metadata-harvester-service-worker:prod
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-harvester}:${POSTGRES_PASSWORD:-harvester}@postgres:5432/${POSTGRES_DB:-harvester}
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
      # public network is required for outbound webhook delivery; no inbound ports are exposed
      - public

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      # future TLS
      # - "443:443"
    volumes:
      - ./nginx/nginx.public.conf:/etc/nginx/nginx.conf:ro
     # - ./certs:/etc/nginx/certs:ro            <-- certificates must be placed and loaded 
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - internal
      - public

volumes:
  pgdata:

networks:
  internal:
    internal: true
  public:
