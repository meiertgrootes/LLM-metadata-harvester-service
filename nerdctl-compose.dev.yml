services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: harvester
      POSTGRES_PASSWORD: harvester
      POSTGRES_DB: harvester
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
    image: llm-metadata-harvester-service-migrate:dev
    environment:
      DATABASE_URL: postgresql+psycopg2://harvester:harvester@postgres:5432/harvester
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      args:
        EXTRAS: "api,runtime,dev"
    command: >
      uvicorn llm_metadata_harvester_service.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    volumes:
      - ./src:/app/src
    image: llm-metadata-harvester-service-api:dev
    environment:
      PYTHONPATH: /app/src
      CELERY_BROKER_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg2://harvester:harvester@postgres:5432/harvester
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY:?Set WEBHOOK_SECRET_KEY to a Fernet key}
      WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-5}
      WEBHOOK_RETRY_BACKOFF: ${WEBHOOK_RETRY_BACKOFF:-2}
      WEBHOOK_RETRY_AFTER_MAX_SECONDS: ${WEBHOOK_RETRY_AFTER_MAX_SECONDS:-300}
      CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: ${CELERY_TASK_SOFT_TIME_LIMIT_SECONDS:-3300}
      CELERY_TASK_TIME_LIMIT_SECONDS: ${CELERY_TASK_TIME_LIMIT_SECONDS:-3600}
      JOB_PENDING_STALE_SECONDS: ${JOB_PENDING_STALE_SECONDS:-4500}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      args:
        EXTRAS: "runtime,dev"
    command: python -m llm_metadata_harvester_service.workers.watchfiles_celery
    volumes:
      - ./src:/app/src
    image: llm-metadata-harvester-service-worker:dev
    environment:
      PYTHONPATH: /app/src
      CELERY_BROKER_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg2://harvester:harvester@postgres:5432/harvester
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY:?Set WEBHOOK_SECRET_KEY to a Fernet key}
      WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-5}
      WEBHOOK_RETRY_BACKOFF: ${WEBHOOK_RETRY_BACKOFF:-2}
      WEBHOOK_RETRY_AFTER_MAX_SECONDS: ${WEBHOOK_RETRY_AFTER_MAX_SECONDS:-300}
      CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: ${CELERY_TASK_SOFT_TIME_LIMIT_SECONDS:-3300}
      CELERY_TASK_TIME_LIMIT_SECONDS: ${CELERY_TASK_TIME_LIMIT_SECONDS:-3600}
      JOB_PENDING_STALE_SECONDS: ${JOB_PENDING_STALE_SECONDS:-4500}
      JOB_QUEUED_STALE_SECONDS: ${JOB_QUEUED_STALE_SECONDS:-86400}
      WEBHOOK_OUTBOX_LEASE_SECONDS: ${WEBHOOK_OUTBOX_LEASE_SECONDS:-60}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  beat:
    image: llm-metadata-harvester-service-worker:dev
    command: ["celery", "-A", "llm_metadata_harvester_service.core.celery_app.celery_app", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    volumes:
      - ./src:/app/src
    environment:
      PYTHONPATH: /app/src
      CELERY_BROKER_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg2://harvester:harvester@postgres:5432/harvester
      JOB_RECONCILE_INTERVAL_SECONDS: ${JOB_RECONCILE_INTERVAL_SECONDS:-60}
      JOB_PENDING_STALE_SECONDS: ${JOB_PENDING_STALE_SECONDS:-4500}
      JOB_QUEUED_STALE_SECONDS: ${JOB_QUEUED_STALE_SECONDS:-86400}
      WEBHOOK_OUTBOX_INTERVAL_SECONDS: ${WEBHOOK_OUTBOX_INTERVAL_SECONDS:-5}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
