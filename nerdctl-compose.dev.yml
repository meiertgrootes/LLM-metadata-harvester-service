services:
  redis:
    image: redis:7-alpine

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: harvester
      POSTGRES_PASSWORD: harvester
      POSTGRES_DB: harvester
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harvester -d harvester"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      args:
        EXTRAS: "api,runtime,dev"
    command: >
      uvicorn llm_metadata_harvester_service.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    volumes:
      - ./src:/app/src
    image: llm-metadata-harvester-service-api:dev
    environment:
      PYTHONPATH: /app/src
      CELERY_BROKER_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg2://harvester:harvester@postgres:5432/harvester
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      args:
        EXTRAS: "runtime,dev"
    command: python -m llm_metadata_harvester_service.workers.watchfiles_celery
    volumes:
      - ./src:/app/src
    image: llm-metadata-harvester-service-worker:dev
    environment:
      PYTHONPATH: /app/src
      CELERY_BROKER_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg2://harvester:harvester@postgres:5432/harvester
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
