name: CI

on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install ".[api,runtime,dev]"
      - name: Fast tests
        run: pytest -q -m "not integration"
      - name: Ruff
        run: ruff check src tests migrations scripts
      - name: Strict mypy
        run: mypy src
      - name: Validate deployment Compose files
        env:
          DATABASE_URL: postgresql+psycopg2://harvester:test@postgres:5432/harvester
          POSTGRES_PASSWORD: test
          WEBHOOK_SECRET_KEY: o1pxvABKy2_-zKRx2m60YhBvsRqGXTNgSbh7wAwmOPY=
        run: |
          docker compose -f nerdctl-compose.dev.yml config --quiet
          docker compose -f nerdctl-compose.local.yml config --quiet
          docker compose -f nerdctl-compose.public.yml config --quiet
      - name: Validate integration Compose file
        run: docker compose -f docker-compose.test.yml config --quiet
      - name: Docker-backed integration tests
        run: pytest -q tests/integration
